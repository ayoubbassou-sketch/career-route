<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Ayoub Bassou: career route from Morocco to partner solutions engineering.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ayoub Bassou Route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one route map that snakes across the page (vertical on phones); each sentence of the pitch reveals one thing on the map. A chapter card sits under the map. */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#141A33; --muted:#5B6280; --line:#D6DBEA;
  --accent:#3049D6; --accent-soft:#E6E9FB;
  --route:#D9932B; --route-soft:#FBF0DE;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1121; --surface:#161B30; --ink:#ECEEF7; --muted:#9AA1BE; --line:#2C3354;
  --accent:#8193FF; --accent-soft:#1E2550; --route:#F0B457; --route-soft:#3A2E17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1121; --surface:#161B30; --ink:#ECEEF7; --muted:#9AA1BE; --line:#2C3354;
  --accent:#8193FF; --accent-soft:#1E2550; --route:#F0B457; --route-soft:#3A2E17; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px;display:flex;flex-direction:column;gap:14px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:16px}
.who .me{width:clamp(56px,7vw,76px);height:clamp(56px,7vw,76px);border-radius:50%;object-fit:cover;object-position:50% 18%;background:#fff;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--accent),0 6px 18px rgba(20,26,51,.15);flex:none}
.contact{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:20px 40px;background:var(--ink);color:var(--bg);border-radius:20px;padding:26px 30px;margin-top:6px}
.c-head{display:flex;flex-direction:column;gap:6px}
.c-eyebrow{font:500 11.5px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--route)}
.c-head h2{margin:0;font:800 clamp(22px,2.6vw,30px)/1.05 var(--font-display);letter-spacing:-.015em;color:var(--bg)}
.c-items{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,1fr);border-left:1px solid color-mix(in srgb,var(--bg) 18%,transparent)}
.c-item{display:flex;align-items:center;gap:12px;min-width:0;padding:6px 18px;background:none;border:0;border-right:1px solid color-mix(in srgb,var(--bg) 18%,transparent);color:inherit;font:inherit;text-align:left;text-decoration:none;cursor:pointer}
.c-item:last-child{border-right:0}
.c-ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--bg) 35%,transparent);transition:background .2s,border-color .2s}
.c-ic svg{width:19px;height:19px;fill:none;stroke:var(--bg);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.c-ic svg .fill{fill:var(--bg);stroke:none}
.c-tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.c-k{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--bg) 62%,transparent)}
.c-st{font-style:normal;text-transform:none;letter-spacing:0;opacity:0;transition:opacity .2s}
.c-v{font:600 15px/1.2 var(--font-body);color:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.c-v{white-space:normal;overflow-wrap:anywhere}}
.c-item:hover .c-ic,.c-item:focus-visible .c-ic{background:var(--route);border-color:var(--route)}
.c-item:hover .c-ic svg,.c-item:focus-visible .c-ic svg{stroke:var(--ink)}
.c-item:hover .c-ic svg .fill{fill:var(--ink)}
.c-item:hover .c-st,.c-item:focus-visible .c-st,.c-item.ok .c-st{opacity:1}
.c-item.ok .c-st{color:var(--route)}
@media (max-width:900px){.contact{grid-template-columns:1fr}.c-items{border-left:0}}
@media (max-width:640px){.c-items{grid-template-columns:1fr;gap:10px}.c-item{border-right:0;padding:6px 0}}
.who h1{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,4.4vw,48px);letter-spacing:-.02em;line-height:1;margin:0}
.who p{margin:6px 0 0;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls button{font:600 14px var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.controls button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--route);outline-offset:2px}

/* ---- map ---- */
.map{position:relative;width:100%;container-type:inline-size}
.map svg{display:block;width:100%;height:auto;overflow:visible}
.road{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.road-dash{fill:none;stroke:var(--surface);stroke-width:2;stroke-dasharray:10 12;stroke-linecap:round}
.progress{fill:none;stroke:var(--route);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.traveller .halo{fill:var(--accent);opacity:.2}
.traveller .core{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.traveller .plane{font-size:40px;display:none}
.traveller.flying .plane{display:inline}
.traveller .plane2,.traveller.flying .plane2{display:none}
.traveller.flying.duo .plane2{display:inline}
.traveller.flying .halo,.traveller.flying .core{display:none}
@media (prefers-reduced-motion:no-preference){.traveller .halo{animation:breathe 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}}

.layer{position:absolute;inset:0;pointer-events:none}
.layer>*{position:absolute;pointer-events:auto}
.node{width:30px;height:30px;border-radius:50%;border:3px solid var(--accent);background:var(--surface);cursor:pointer;transform:translate(-50%,-50%);padding:0;transition:background .3s,transform .2s}
.node:hover{transform:translate(-50%,-50%) scale(1.15)}
.node.visited{background:var(--route);border-color:var(--route)}
.node.here{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 6px var(--accent-soft)}
.node.final{border-style:dashed}
.label{cursor:pointer;background:none;border:0;padding:0;color:var(--ink);text-align:center;white-space:nowrap;font:inherit}
.label .yr{display:block;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--route)}
.label .pl{display:block;font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.15}
.label.left{text-align:left}
.label.right{text-align:right}
.label{opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.label.on{opacity:1;visibility:visible;transition:opacity .4s}

/* stickers: up to 2 per row; above the road they stack upwards */
.stickers{display:flex;flex-wrap:wrap;gap:8px;width:200px;justify-content:center;pointer-events:none}
.stickers.up{flex-wrap:wrap-reverse}
.stickers.start{justify-content:flex-start}
.stickers.cluster{display:grid;grid-template-columns:repeat(3,auto);gap:6px;width:auto}
.tile{position:relative;box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;width:96px;height:58px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(20,26,51,.12)}
.cluster .tile{width:70px;height:40px;padding:6px 8px;border-radius:9px}
.tile img{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain}
.tile .stk{position:absolute;right:-10px;top:-12px;font-size:22px;line-height:1}
.tile .tag{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);white-space:nowrap;font:500 10.5px/1 var(--font-mono);background:var(--route);color:#1d1404;padding:3px 7px;border-radius:999px}
.tile.word{font-family:var(--font-display);font-weight:800;font-size:17px;color:#141A33}
.tile.note{flex-direction:column;gap:2px;text-align:center;color:#141A33}
.tile.note .e{font-size:20px;line-height:1.1;white-space:nowrap}
.tile.note .t{font:500 10.5px/1.15 var(--font-mono);color:#3a4160}
.cluster .tile.note .e{font-size:18px}
.trip{display:flex;gap:3px;font-size:17px}
.trip span{opacity:.25}
.tile.show .trip span{animation:lit .35s both}
.tile.show .trip span:nth-child(1){animation-delay:.3s}.tile.show .trip span:nth-child(2){animation-delay:.75s}
.tile.show .trip span:nth-child(3){animation-delay:1.2s}.tile.show .trip span:nth-child(4){animation-delay:1.65s}
.tile.show .trip span:nth-child(5){animation-delay:2.1s}

.stickers .tile{opacity:0;transform:scale(.3) rotate(-12deg);visibility:hidden}
.stickers .tile.show{opacity:1;visibility:visible;transform:scale(1) rotate(var(--r,0deg));transition:transform .55s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.stickers.dim .tile.show{opacity:.6}
.tile.opener{pointer-events:auto;cursor:pointer}
.tile.opener.show.invite{animation:invite 1.6s ease-in-out infinite}
@keyframes invite{0%,100%{box-shadow:0 6px 18px rgba(20,26,51,.12),0 0 0 0 var(--accent-soft)}50%{box-shadow:0 6px 18px rgba(20,26,51,.12),0 0 0 7px var(--accent-soft)}}

.map.desk .node{width:clamp(18px,2.5cqw,30px);height:clamp(18px,2.5cqw,30px);border-width:clamp(2px,.25cqw,3px)}
.map.desk .label .pl{font-size:clamp(11px,1.4cqw,17px)}
.map.desk .label .yr{font-size:clamp(9px,1.05cqw,12.5px)}
.map.desk .stickers{gap:1.5cqw .8cqw;width:16.8cqw}
.map.desk .stickers.cluster{gap:.6cqw;width:auto}
.map.desk .tile{width:8cqw;height:4.8cqw;padding:.7cqw .8cqw;border-radius:1cqw}
.map.desk .cluster .tile{width:5.6cqw;height:3.4cqw;padding:.45cqw .6cqw;border-radius:.8cqw}
.map.desk .cluster .tile.show{transition:transform .55s cubic-bezier(.3,1.6,.5,1),opacity .2s,width .45s,height .45s,padding .45s}
.cluster .tile .tag{display:none}
.zemoji{font-size:26px;line-height:1}
.plat{display:flex;flex-direction:column;align-items:center;gap:14px}
.plat .core{display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:14px;background:var(--accent);color:#fff;font:800 22px/1.1 var(--font-display)}
.plat .core .ci{font-size:24px}
.plat .but{font:500 13px/1 var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.plat .more{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
.plat .more .acq{display:flex;align-items:center;justify-content:center;width:100%;height:30px;box-sizing:border-box;padding:5px 8px;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px}
.plat .more .acq img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.map.desk .plat .more .acq{height:3cqw;padding:.5cqw .7cqw;border-radius:.7cqw;margin-top:.4cqw}
.plat .more div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.plat .more em{font-style:normal;font-size:26px;line-height:1}
.plat .more b{font:700 15px/1.1 var(--font-display)}
.plat .more .etc{border-style:dashed}
.on .plat .core{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.on .plat .but{animation:fadein .4s .45s both}
.on .plat .more div{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.on .plat .more div:nth-child(1){animation-delay:.8s}.on .plat .more div:nth-child(2){animation-delay:1.1s}
.on .plat .more div:nth-child(3){animation-delay:1.4s}.on .plat .more div:nth-child(4){animation-delay:1.7s}.on .plat .more div:nth-child(5){animation-delay:2s}
.areas.five .new{grid-column:1/-1;justify-content:center;border-color:var(--route);background:var(--route-soft)}
.areas .nb{font:600 11px/1 var(--font-mono);background:var(--route);color:#1d1404;padding:4px 8px;border-radius:999px;margin-left:6px}
.on .areas div:nth-child(5){animation-delay:1.5s}
.map.desk .plat{gap:1.4cqw}
.map.desk .plat .core{gap:1cqw;padding:1.4cqw 2.2cqw;border-radius:1.4cqw;font-size:2.3cqw}
.map.desk .plat .core .ci{font-size:2.5cqw}
.map.desk .plat .but{font-size:1.15cqw}
.map.desk .plat .more{gap:1cqw}
.map.desk .plat .more div{gap:.6cqw;padding:1.3cqw .8cqw;border-radius:1.2cqw}
.map.desk .plat .more em{font-size:2.8cqw}
.map.desk .plat .more b{font-size:1.6cqw}
.map.desk .areas .nb{font-size:1cqw;padding:.4cqw .8cqw;margin-left:.6cqw}
.ex{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.exc{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.exc .who{font:600 11.5px/1 var(--font-mono);background:var(--route-soft);color:var(--ink);border:1px solid var(--route);padding:5px 9px;border-radius:999px}
.exc em{font-style:normal;font-size:30px;line-height:1}
.exc b{font:800 18px/1.15 var(--font-display)}
.exc p{margin:0;font-size:14px;line-height:1.4;color:var(--muted)}
a.exc{color:inherit;text-decoration:none;cursor:pointer;border-color:var(--accent);transition:transform .2s,box-shadow .2s}
a.exc:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(48,73,214,.18)}
.exc .open{margin-top:auto;font:600 12.5px/1 var(--font-mono);color:var(--accent)}
.map.desk .exc .open{font-size:1.1cqw}
.on .ex .exc{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.on .ex .exc:nth-child(2){animation-delay:.5s}.on .ex .exc:nth-child(3){animation-delay:1s}
.map.desk .ex{gap:1.2cqw}
.map.desk .exc{gap:.8cqw;padding:1.6cqw;border-radius:1.4cqw}
.map.desk .exc .who{font-size:1.05cqw;padding:.45cqw .8cqw}
.map.desk .exc em{font-size:3cqw}
.map.desk .exc b{font-size:1.8cqw}
.map.desk .exc p{font-size:1.3cqw}
.ztitle{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.01em}
.map.desk .ztitle{font-size:2.4cqw}
.node.bulb,.node.bulb.here{background:var(--surface);border-color:var(--route);box-shadow:0 0 0 6px var(--route-soft);display:grid;place-items:center;font-size:20px;line-height:1;width:44px;height:44px;animation:bulbpulse 1.6s ease-in-out infinite}
.map.desk .node.bulb{width:3.8cqw;height:3.8cqw;font-size:2.1cqw}
@keyframes bulbpulse{0%,100%{box-shadow:0 0 0 4px var(--route-soft)}50%{box-shadow:0 0 0 12px var(--route-soft)}}
.zdots:empty{display:none}
.logos5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.logos5 .lg{display:flex;flex-direction:column;align-items:center;gap:10px}
.logos5 .box{box-sizing:border-box;width:100%;height:84px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(20,26,51,.1)}
.logos5 .box img{display:block;width:100%;height:100%;object-fit:contain}
.logos5 .tg{font:500 12px/1 var(--font-mono);background:var(--route);color:#1d1404;padding:5px 10px;border-radius:999px;white-space:nowrap}
.on .logos5 .lg{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.on .logos5 .lg:nth-child(2){animation-delay:.3s}.on .logos5 .lg:nth-child(3){animation-delay:.6s}.on .logos5 .lg:nth-child(4){animation-delay:.9s}.on .logos5 .lg:nth-child(5){animation-delay:1.2s}
.map.desk .zemoji{font-size:2.6cqw}
.map.desk .logos5{gap:1.4cqw}
.map.desk .logos5 .lg{gap:1cqw}
.map.desk .logos5 .box{height:8cqw;padding:1.2cqw;border-radius:1.2cqw}
.map.desk .logos5 .tg{font-size:1.15cqw;padding:.45cqw .9cqw}
.map.desk .tile.word{font-size:1.45cqw}
.map.desk .tile .stk{font-size:1.9cqw;right:-.8cqw;top:-1cqw}
.map.desk .tile .tag{font-size:max(8px,.85cqw);bottom:-.75cqw;padding:.25cqw .6cqw}
.map.desk .tile.note .e{font-size:1.7cqw}
.map.desk .tile.note .t{font-size:max(8px,.9cqw)}
.map.desk .cluster .tile.note .e{font-size:1.6cqw}
.map.desk .trip{font-size:1.4cqw;gap:.25cqw}

.degrees{display:flex;gap:6px;align-items:center;pointer-events:none;font-family:var(--font-mono);font-size:12.5px;white-space:nowrap;
  background:var(--route-soft);color:var(--ink);border:1px solid var(--route);border-radius:999px;padding:4px 10px 4px 6px;opacity:0;visibility:hidden}
.map.desk .degrees{font-size:clamp(10px,1.05cqw,13px)}
.degrees .cap{font-size:1.5em;line-height:1;display:inline-block;opacity:0;transform:translateY(-14px) scale(.4)}
.degrees.show{opacity:1;visibility:visible;transition:opacity .25s}
.degrees.show .cap{opacity:1;transform:none;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.degrees.show .cap:nth-child(2){transition-delay:.25s}
.degrees.show .txt{animation:fadein .4s .45s both}

.ring{position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid var(--route);transform:translate(-50%,-50%);pointer-events:none;animation:ring .8s ease-out forwards}

/* ---- card ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:grid;grid-template-columns:1fr 1.15fr;gap:16px 32px;align-items:start}
.card>*{min-width:0}
@media (max-width:760px){.card{grid-template-columns:1fr}}
.card .eyebrow{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--route)}
.card h2{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,3vw,34px);letter-spacing:-.015em;line-height:1.08;margin:4px 0 10px;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:16px;max-width:60ch}
.steps{display:flex;gap:6px;margin-top:12px}
.steps i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--route)}
.steps i.now{background:var(--accent)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.card li{padding-left:18px;position:relative;font-size:15.5px;color:var(--muted);transition:color .3s}
.card li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:2px;background:var(--line)}
.card li.on::before{background:var(--route)}
.card li.now{color:var(--ink);font-weight:600}
.card li.now::before{background:var(--accent)}
.card li.later{visibility:hidden}
.card.flash{animation:cardin .45s ease-out}
.hint{font-family:var(--font-mono);font-size:12px;color:var(--muted)}


/* Amadeus explainer panel under the stop: one view per beat */
.jr{display:grid;grid-template-columns:repeat(6,1fr);position:relative;gap:2px}
.jr .bar{position:absolute;left:8%;right:8%;top:17px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.jr .bar i{display:block;height:100%;width:0;background:var(--route)}
.on .jr .bar i{animation:fill 2.9s .5s linear forwards}
.jr .st{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;z-index:1}
.jr .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--surface);border:2px solid var(--line);opacity:.35}
.jr .lb{font:500 10.5px/1.1 var(--font-mono);color:var(--muted);text-align:center;white-space:nowrap}
.on .jr .ic{animation:stepon .35s forwards}
.on .jr .st:nth-child(2) .ic{animation-delay:.5s}.on .jr .st:nth-child(3) .ic{animation-delay:1.05s}
.on .jr .st:nth-child(4) .ic{animation-delay:1.6s}.on .jr .st:nth-child(5) .ic{animation-delay:2.15s}
.on .jr .st:nth-child(6) .ic{animation-delay:2.7s}.on .jr .st:nth-child(7) .ic{animation-delay:3.25s}
.sol{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sol div{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;background:var(--bg)}
.sol code{display:block;font:600 15px/1.1 var(--font-mono);color:var(--accent)}
.sol b{display:block;font:700 14px/1.2 var(--font-display);margin-top:4px}
.sol span{display:block;font:500 10px/1.2 var(--font-mono);color:var(--muted);margin-top:2px}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.areas div{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font:600 13px/1.2 var(--font-display)}
.areas div em{font-style:normal;font-size:18px}
.on .sol div,.on .areas div{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.on .sol div:nth-child(2),.on .areas div:nth-child(2){animation-delay:.35s}
.on .sol div:nth-child(3),.on .areas div:nth-child(3){animation-delay:.7s}
.on .areas div:nth-child(4){animation-delay:1.05s}
/* Amadeus zoom: a card grows out of the stop, one view per beat */
.zoom{display:grid;place-items:center;background:transparent;pointer-events:none!important;visibility:hidden;transition:background .45s,visibility 0s .55s;z-index:3;border-radius:16px}
.zoom.open{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);pointer-events:auto!important;visibility:visible;transition:background .45s}
.zcard{box-sizing:border-box;width:min(92%,760px);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px 26px;box-shadow:0 30px 80px rgba(20,26,51,.25);transform:translate(var(--dx,0px),var(--dy,0px)) scale(.12);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .35s}
.zoom.open .zcard{transform:none;opacity:1}
.zhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.zhead img{height:26px;width:auto}
.zdots{display:flex;gap:6px}
.zdots i{width:26px;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.zdots i.on{background:var(--accent)}
.zclose{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;width:34px;height:34px;font-size:18px;line-height:1;cursor:pointer}
.zoom section{display:none}
.zoom section.on{display:block}
.map.desk .zcard{width:66cqw;padding:2cqw 2.4cqw 2.6cqw;border-radius:1.8cqw}
.map.desk .zhead{margin-bottom:2.2cqw}
.map.desk .zhead img{height:2.6cqw}
.map.desk .zdots i{width:2.6cqw;height:.5cqw}
.map.desk .zclose{width:3cqw;height:3cqw;font-size:1.6cqw}
.map.desk .jr{gap:.6cqw}
.map.desk .jr .bar{top:3.2cqw;height:.35cqw}
.map.desk .jr .ic{width:6.4cqw;height:6.4cqw;font-size:3.1cqw;border-width:.25cqw}
.map.desk .jr .st{gap:.9cqw}
.map.desk .jr .lb{font-size:1.35cqw}
.map.desk .sol{gap:1.4cqw}
.map.desk .sol div{padding:1.8cqw 1cqw;border-radius:1.2cqw}
.map.desk .sol code{font-size:2.6cqw}
.map.desk .sol b{font-size:2.1cqw;margin-top:.8cqw}
.map.desk .sol span{font-size:1.2cqw;margin-top:.4cqw}
.map.desk .areas{gap:1.2cqw}
.map.desk .areas div{padding:1.5cqw 1.7cqw;border-radius:1.2cqw;font-size:1.9cqw;gap:1.2cqw}
.map.desk .areas div em{font-size:2.8cqw}
@keyframes fill{to{width:100%}}
@keyframes stepon{to{opacity:1;background:var(--accent-soft);border-color:var(--accent)}}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.on .jr .ic,.on .jr .bar i,.on .sol div,.on .areas div{animation:none}.jr .ic{opacity:1}.jr .bar i{width:100%}}
@keyframes ring{from{width:30px;height:30px;opacity:1}to{width:120px;height:120px;opacity:0}}
@keyframes breathe{0%,100%{transform:scale(.8)}50%{transform:scale(1.35)}}
@keyframes cardin{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes lit{from{opacity:.25;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ring{display:none}.stickers .tile.show,.degrees.show .cap{transition:none}.card.flash{animation:none}.tile.show .trip span{animation:none;opacity:1}}
</style>

const ZOOMS = {
  amadeus:{views:3, label:'Amadeus', head:`<img src="${L('amadeus.svg')}" alt="Amadeus">`, html:PANEL_HTML},
  claude:{views:1, label:'Claude', head:'<span class="ztitle">What I built with Claude ✨</span>', html:CLAUDE_HTML},
  brevo:{views:2, label:'Brevo', head:`<img src="${L('brevo.png')}" alt="Brevo">`, html:BREVO_HTML},
  pivot:{views:1, label:'Multinationals', head:'<span class="ztitle">Multinationals</span>', html:PIVOT_HTML}
};
const BEATS=[]; STOPS.forEach((s,k)=>s.beats.forEach((_,j)=>BEATS.push({k,j})));

const GEO = {
  desktop:{W:1200,H:720,d:'M110 170 L1000 170 C1160 170 1160 510 1000 510 L250 510'},
  mobile:{W:400,H:2200,d:'M60 80 C 20 400, 100 560, 60 850 S 20 1300, 60 1600 S 100 1950, 60 2140'}
};
const svg=document.getElementById('svg'), road=document.getElementById('road'), dash=document.getElementById('roadDash'),
      prog=document.getElementById('progress'), trav=document.getElementById('traveller'), plane=document.getElementById('plane'), plane2=document.getElementById('plane2'),
      layer=document.getElementById('layer'), map=document.getElementById('map');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let mode, G, total, pos=-1, stopAt=-1, curLen=0, anim=null, pending=-1, playTimer=null;

const pct=(v,m)=>(v/m*100)+'%';
function closestLen(x,y){let best=0,bd=1e12;for(let i=0;i<=900;i++){const l=total*i/900,p=road.getPointAtLength(l),d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;best=l}}return best}

function makeTile(tl,j){
  const t=document.createElement('div'); t.style.setProperty('--r',((j%2?1:-1)*(2+j%3))+'deg');
  if(tl.src){t.className='tile'; const im=document.createElement('img'); im.src=tl.src; im.alt=tl.alt; t.appendChild(im)}
  else if(tl.w){t.className='tile word'; t.textContent=tl.w}
  else if(tl.trip){t.className='tile note'; const r=document.createElement('div'); r.className='trip'; tl.trip.forEach(x=>{const sp=document.createElement('span'); sp.textContent=x; r.appendChild(sp)}); t.appendChild(r);
    const tx=document.createElement('div'); tx.className='t'; tx.textContent=tl.t; t.appendChild(tx)}
  else {t.className='tile note'; const e=document.createElement('div'); e.className='e'; e.textContent=tl.e; t.appendChild(e);
    if(tl.t){const tx=document.createElement('div'); tx.className='t'; tx.textContent=tl.t; t.appendChild(tx)}}
  if(tl.stk){const s=document.createElement('span'); s.className='stk'; s.setAttribute('aria-hidden','true'); s.textContent=tl.stk; t.appendChild(s)}
  if(tl.tag){const g=document.createElement('span'); g.className='tag'; g.textContent=tl.tag; t.appendChild(g)}
  return t;
}

function build(){
  mode = matchMedia('(max-width:700px)').matches ? 'mobile' : 'desktop';
  G = GEO[mode]; map.classList.toggle('desk',mode==='desktop');
  svg.setAttribute('viewBox',`0 0 ${G.W} ${G.H}`);
  [road,dash,prog].forEach(p=>p.setAttribute('d',G.d));
  total = road.getTotalLength(); prog.style.strokeDasharray = total;
  layer.innerHTML='';
  STOPS.forEach((s,k)=>{
    s.len = mode==='desktop' ? closestLen(s.dx,s.dy) : total*(0.04 + k*0.131);
    const p = road.getPointAtLength(s.len); s.x=p.x; s.y=p.y;
    const left=pct(p.x,G.W), top=pct(p.y,G.H);
    let lblT, stkT, lblCls='label', up=false, start=false;
    if(mode==='mobile'){ lblT='translate(28px,-50%)'; stkT='translate(28px,34px)'; lblCls+=' left'; start=true; }
    else if(s.id==='pivot'){ lblT='translate(calc(-100% - 2.4cqw),calc(-50% - 7.4cqw))'; stkT='translate(calc(-100% - 2.4cqw),-50%)'; lblCls+=' right'; }
    else if(s.y < G.H/2){ lblT='translate(-50%,2.1cqw)'; stkT='translate(-50%,calc(-100% - 2.3cqw))'; up=true; }
    else { lblT='translate(-50%,calc(-100% - 2.1cqw))'; stkT='translate(-50%,2.3cqw)'; }
    const node=document.createElement('button'); node.type='button'; node.className='node'+(s.final?' final':''); node.style.left=left; node.style.top=top;
    node.setAttribute('aria-label',`${s.pl}, ${s.yr}`); node.addEventListener('click',()=>{stopPlay();clickStop(k)});
    const lbl=document.createElement('button'); lbl.type='button'; lbl.className=lblCls; lbl.tabIndex=-1; lbl.style.left=left; lbl.style.top=top; lbl.style.transform=lblT;
    lbl.innerHTML='<span class="yr"></span><span class="pl"></span>'; lbl.querySelector('.yr').textContent=s.yr; lbl.querySelector('.pl').textContent=s.pl;
    lbl.addEventListener('click',()=>{stopPlay();clickStop(k)});
    const st=document.createElement('div'); st.className='stickers'+(s.cluster?' cluster':'')+(up?' up':'')+(start?' start':'');
    st.style.left=left; st.style.top=top; st.style.transform=stkT;
    s.tileEls = s.tiles.map((tl,j)=>{const t=makeTile(tl,j); st.appendChild(t); return t});
    if(s.zoom && s.tiles.some(t=>t.open)){ const o=s.tileEls[s.tiles.findIndex(t=>t.open)]; s.opener=o; o.classList.add('opener'); o.setAttribute('role','button'); o.tabIndex=0; o.setAttribute('aria-label','Open details');
      const go=()=>{ if(stopAt!==k || pos<0) return; const z=s.zoomAt||0, j=BEATS[pos].j, V=ZOOMS[s.zoom].views;
        if(j===z) setPos(pos+1); else if(j>z+V) setPos(idx(k,z+1)); }; o.addEventListener('click',go); o.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}}); }
    let deg=null;
    if(false){
      deg=document.createElement('div'); deg.className='degrees'; deg.style.left=left; deg.style.top=top;
      deg.style.transform = mode==='mobile' ? 'translate(250px,-50%)' : 'translate(-50%,5.4cqw)';
      deg.innerHTML='<span class="cap">📜</span><span class="cap">📜</span><span class="txt">Two diplomas</span>';
    }
    let panel=null;
    if(s.zoom){ const Z=ZOOMS[s.zoom];
      panel=document.createElement('div'); panel.className='zoom'; panel.style.left='0'; panel.style.top='0'; panel.style.width='100%'; panel.style.height='100%';
      panel.innerHTML=`<div class="zcard" role="dialog" aria-label="${Z.label}"><div class="zhead">${Z.head}<div class="zdots">${Z.views>1?'<i></i>'.repeat(Z.views):''}</div><button type="button" class="zclose" aria-label="Close">×</button></div>${Z.html}</div>`;
      panel.addEventListener('click',e=>{ if(e.target===panel||e.target.closest('.zclose')) closeZoom(k); });
    }
    layer.append(st,lbl,node); if(deg) layer.appendChild(deg); if(panel) layer.appendChild(panel);
    s.el={node,lbl,st,deg,panel};
  });
  if(mode==='mobile'){ const d=STOPS[1].el.deg; if(d) d.style.transform='translate(28px,-170%)'; }
  curLen = stopAt>=0 ? STOPS[stopAt].len : 0; place(curLen);
  applyVis(-1);
}

function shown(k){ if(pos<0) return 0; const c=BEATS[pos]; if(k<c.k) return STOPS[k].beats.length; if(k===c.k) return c.j+1; return 0; }
function applyVis(hide){
  STOPS.forEach((s,k)=>{
    const n = k===hide ? 0 : shown(k);
    s.tileEls.forEach((t,j)=>t.classList.toggle('show', s.tiles[j].b < n));
    const za = s.zoomAt||0;
    if(s.opener) s.opener.classList.toggle('invite', k===stopAt && k!==hide && n===za+1);
    if(s.bulb){ const b = k===stopAt && k!==hide && n===1; s.el.node.classList.toggle('bulb', b); s.el.node.textContent = b ? '💡' : ''; }
    s.el.node.classList.toggle('visited', n>0);
    s.el.lbl.classList.toggle('on', n>0);
    s.el.node.classList.toggle('here', k===stopAt && k!==hide && n>0);
    s.el.st.classList.toggle('dim', k!==stopAt);
    if(s.el.deg) s.el.deg.classList.toggle('show', n>0);
    if(s.el.panel){ const V=ZOOMS[s.zoom].views, v = (k===stopAt && k!==hide) ? n-1-za : 0, open = v>=1 && v<=V, z=s.el.panel;
      if(open && !z.classList.contains('open')){ const r=map.getBoundingClientRect(), c=z.querySelector('.zcard');
        c.style.setProperty('--dx',(s.x/G.W*r.width - r.width/2)+'px'); c.style.setProperty('--dy',(s.y/G.H*r.height - r.height/2)+'px'); }
      z.classList.toggle('open', open);
      z.querySelectorAll('section').forEach(sec=>sec.classList.toggle('on', +sec.dataset.v===v));
      z.querySelectorAll('.zdots i').forEach((d,i)=>d.classList.toggle('on', i===v-1)); }
  });
}

function place(l){
  const p=road.getPointAtLength(l); trav.setAttribute('transform',`translate(${p.x} ${p.y})`);
  const q=road.getPointAtLength(Math.min(total,l+2)), b=road.getPointAtLength(Math.max(0,l-2));
  if(trav.classList.contains('duo')){ const t=road.getPointAtLength(Math.max(0,l-46)); plane2.setAttribute('transform',`translate(${t.x-p.x} ${t.y-p.y})`); }
  plane.setAttribute('transform', plane.dataset.rot==='1' ? `rotate(${Math.atan2(q.y-b.y,q.x-b.x)*180/Math.PI+45})` : '');
  prog.style.strokeDashoffset = total - l;
}
function travelTo(target, done){
  if(anim) cancelAnimationFrame(anim);
  const from=curLen, dist=Math.abs(target-from);
  if(reduce||dist<1){curLen=target;place(target);done();return}
  const dur=trav.classList.contains('flying')?2200:Math.min(1700,Math.max(500,dist*1.4)), t0=performance.now();
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const step=now=>{const t=Math.min(1,(now-t0)/dur); curLen=from+(target-from)*ease(t); place(curLen);
    if(t<1) anim=requestAnimationFrame(step); else {anim=null; done()}};
  anim=requestAnimationFrame(step);
}
function ring(s){ if(reduce) return; const r=document.createElement('div'); r.className='ring'; r.style.left=pct(s.x,G.W); r.style.top=pct(s.y,G.H); layer.appendChild(r); setTimeout(()=>r.remove(),900); }


function fillCard(){}

function setPos(p){
  if(p<-1||p>=BEATS.length) return;
  pos=p; fillCard();
  if(p<0){ if(anim) cancelAnimationFrame(anim); stopAt=-1; trav.classList.remove('flying'); curLen=0; place(0); applyVis(-1); return; }
  const k=BEATS[p].k;
  if(k!==stopAt){
    const target=STOPS[k].len;
    const icon = {paris:['✈️'], skema:['💡'], amadeus:['⚙️','📈'], brevo:['🚀'], ai:['🏆']}[STOPS[k].id];
    const fly = !!icon && !reduce && target>curLen;
    trav.classList.toggle('duo', fly && icon.length>1);
    if(fly){ plane.textContent=icon[0]; plane2.textContent=icon[1]||''; plane.dataset.rot = (icon[0]==='✈️'||icon[0]==='🚀') ? '1' : ''; }
    stopAt=k; trav.classList.toggle('flying',fly);
    applyVis(k);
    const token=++pending;
    travelTo(target,()=>{ if(token!==pending) return; trav.classList.remove('flying'); applyVis(-1); ring(STOPS[k]); });
  } else applyVis(-1);
}
function idx(k,j){ return BEATS.findIndex(b=>b.k===k && b.j===j); }
function views(k){ return STOPS[k].zoom ? ZOOMS[STOPS[k].zoom].views : 0; }
function za(k){ return STOPS[k].zoomAt||0; }
function closeZoom(k){ setPos(idx(k, za(k)+views(k)+1)); }
function zoomOpen(){ if(pos<0) return false; const {k,j}=BEATS[pos]; return views(k)>0 && j>=za(k)+1 && j<=za(k)+views(k); }
function first(k){ return BEATS.findIndex(b=>b.k===k); }
function next(){
  if(pos>=0){ const {k,j}=BEATS[pos]; if(views(k) && j===za(k)) return setPos(idx(k, za(k)+views(k)+1)+1); }
  setPos(pos+1);
}
function prev(){
  if(pos>0){ const b=BEATS[pos-1]; if(views(b.k) && b.j===za(b.k)+views(b.k)+1) return setPos(idx(b.k,za(b.k))); }
  setPos(pos-1);
}
function clickStop(k){
  if(pos>=0 && BEATS[pos].k===k && BEATS[pos].j < STOPS[k].beats.length-1) setPos(pos+1);
  else if(!(pos>=0 && BEATS[pos].k===k)) setPos(BEATS.findIndex(b=>b.k===k));
}

function stopPlay(){}
document.getElementById('reset').addEventListener('click',()=>{stopPlay(); setPos(-1)});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();stopPlay();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();stopPlay();prev()}
  else if(e.key==='Escape'&&zoomOpen()){e.preventDefault();closeZoom(BEATS[pos].k)}
});
document.querySelectorAll('.contact .cp').forEach(b=>b.addEventListener('click',()=>{
  const txt=b.dataset.copy, st=b.querySelector('.c-st'), v=b.querySelector('.c-v');
  const flash=t=>{ st.textContent='· '+t; b.classList.add('ok'); setTimeout(()=>{ st.textContent='· click to copy'; b.classList.remove('ok'); },1600); };
  const pick=()=>{ const sel=getSelection(), rg=document.createRange(); rg.selectNodeContents(v); sel.removeAllRanges(); sel.addRange(rg); flash('selected'); };
  try{ navigator.clipboard.writeText(txt).then(()=>flash('copied'),pick); }catch(e){ pick(); }
}));
let lastMode=matchMedia('(max-width:700px)').matches?'mobile':'desktop';
addEventListener('resize',()=>{const m=matchMedia('(max-width:700px)').matches?'mobile':'desktop'; if(m!==lastMode){lastMode=m;build()}});
build(); fillCard();
})();
